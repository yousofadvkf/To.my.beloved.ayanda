<!DOCTYPE html>
<html lang="tr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hayatımın Aşkına ✨</title>
    <style>
        body {
            background-color: #fff0f3;
            color: #5c4033;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background-color: #ffffff;
            padding: 30px 20px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.4);
            max-width: 400px;
            width: 100%;
            border: 2px solid #ffccd5;
        }
        h1 {
            color: #d81b60;
            font-size: 24px;
            margin-bottom: 15px;
        }
        p {
            color: #885f66;
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 20px;
        }
        .heart {
            font-size: 40px;
            color: #ff5c8a;
            animation: pulse 1.5s infinite;
            margin-bottom: 10px;
        }
        .memory-img {
            width: 100%;
            border-radius: 18px;
            margin-top: 10px;
            margin-bottom: 20px;
            border: 3px solid #ffe5ec;
            box-shadow: 0 5px 15px rgba(255, 133, 162, 0.25);
        }
        .music-box {
            margin-top: 15px;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid #ffccd5;
            box-shadow: 0 4px 12px rgba(255, 182, 193, 0.3);
        }
        .music-label {
            font-size: 14px;
            color: #d81b60;
            font-weight: bold;
            margin-bottom: 8px;
            display: block;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="heart">❤️</div>
        <h1>Hayatımın En Değerli Varlığına</h1>
        <p>Bu site tamamen senin için, sadece senin için tasarlandı.. Sevgimi ve hayatımdaki güzel varlığın için duyduğum minnettarlığı ifade etmek için. Buradaki her kelime senin adını söylüyor sevgilim. ✨</p>
        
        <!-- صورتك التي رفعتها -->
        <img src="3A4460ED-57EC-4ACB-80F2-DC695F3752D8.jpeg" alt="Bizim Anımız" class="memory-img">

        <!-- الأغنية الرومانسية من يوتيوب -->
        <span class="music-label">🎵 Senin İçin Seçtiğim Şarkı</span>
        <div class="music-box">
            <iframe width="100%" height="180" src="https://www.youtube.com/embed/S1np2x4BpsY" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

</body>
</html>
